[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirae-financial-product-agent"
version = "0.2.0"
description = "Grounded HyperCLOVA X financial-product analyst for the 2026 Mirae Asset AI Festival"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb==1.3.2",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==20.0.0",
  "pydantic==2.13.4",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
qa = [
  "cryptography==45.0.6",
]
dev = [
  "cryptography==45.0.6",
  "jsonschema==4.25.0",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
include = ["app*", "etl*", "qa_chat*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: reads all organizer workbooks and rebuilds the full serving database",
  "e2e: starts a real HTTP process or container",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", "inputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
