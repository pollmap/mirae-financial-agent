<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융상품 Agent 데모</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #1c2733; --sub: #5b6b7c;
    --accent: #f58220; --accent-ink: #ffffff; --line: #e3e8ee;
    --ok: #1a7f4b; --warn: #a05a00; --bad: #b3261e; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b; --card: #1a212a; --ink: #e8edf2; --sub: #9aa8b6;
      --line: #2a3441; --chip: #232d38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Malgun Gothic", Pretendard, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0 0 20px; color: var(--sub); font-size: .9rem; }
  .banner {
    background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: .82rem; color: var(--sub); margin-bottom: 20px;
  }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink);
  }
  button {
    padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .samples button {
    background: var(--chip); color: var(--ink); font-size: .82rem;
    padding: 7px 12px; border: 1px solid var(--line);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 16px;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: .78rem; font-weight: 600; margin-right: 8px;
  }
  .b-FULL { background: #d9f2e4; color: var(--ok); }
  .b-PARTIAL_WITH_COVERAGE { background: #fdeeda; color: var(--warn); }
  .b-NEEDS_CLARIFICATION { background: #e3ecfb; color: #2456a6; }
  .b-UNAVAILABLE { background: #fbdddb; color: var(--bad); }
  .meta { color: var(--sub); font-size: .82rem; margin-top: 4px; }
  .answer { white-space: pre-wrap; margin-top: 12px; font-size: .97rem; }
  .clarify-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .clarify-opts button { background: #2456a6; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--sub); font-size: .85rem; }
  pre {
    background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: .78rem; white-space: pre-wrap;
    word-break: break-all;
  }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: .82rem; }
  th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px; }
  th { color: var(--sub); font-weight: 600; }
  .spin { color: var(--sub); font-size: .9rem; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>금융상품 Agent 데모</h1>
    <p>국내채권 · 국내 ETF/ETN · 해외 ETF/ETN · 공모펀드 — 데이터 스냅샷 기준 조회</p>
  </header>
  <div class="banner">
    개발 환경 전용 화면입니다. 제출 평가 대상은 GET <code>/answer</code> API이며,
    이 화면은 같은 API를 그대로 호출해 보여줍니다. 데이터는 주최 측 제공 스냅샷
    기준으로 실시간 정보가 아니며, 투자 추천이 아닙니다.
  </div>

  <form id="f">
    <input id="q" type="text" placeholder="예: 국내 ETF만 대상으로 1년 수익률이 높은 3개를 알려줘." autocomplete="off" required>
    <button id="go" type="submit">질문</button>
  </form>
  <div class="samples" id="samples"></div>
  <div id="out"></div>
</div>

<script>
"use strict";
const SAMPLES = [
  "채권 코드 KR101501DA16의 상세 정보를 알려줘.",
  "국내 ETF만 대상으로 1년 수익률이 높은 3개를 알려줘.",
  "수익률 높은 ETF 3개 알려줘",
  "위험등급이 1등급인 공모펀드는 몇 개야?",
  "상품군별 상품 수를 알려줘",
];
const $ = (id) => document.getElementById(id);
const out = $("out");
let seq = 0;
let pending = null; // { token, question }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

SAMPLES.forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = s;
  b.onclick = () => { $("q").value = s; ask(s); };
  $("samples").appendChild(b);
});

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) ask(q);
});

async function ask(question, clarValue) {
  $("go").disabled = true;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="spin">응답 대기 중…</div>';
  out.prepend(card);

  const params = new URLSearchParams({
    question_id: "DEMO-WEB-" + (++seq),
    question: question,
  });
  if (clarValue && pending && pending.question === question) {
    params.set("clarification_token", pending.token);
    params.set("clarification_response", clarValue);
  }

  let data = null, status = 0;
  try {
    const res = await fetch("/answer?" + params.toString());
    status = res.status;
    data = await res.json();
  } catch (err) {
    card.innerHTML = '<div class="err">요청 실패: ' + esc(err) + "</div>";
    $("go").disabled = false;
    return;
  }
  $("go").disabled = false;
  render(card, question, status, data);
}

function render(card, question, status, data) {
  if (!data || !data.retrieved_context) {
    card.innerHTML =
      '<div class="err">HTTP ' + status + "</div><pre>" +
      esc(JSON.stringify(data, null, 1)) + "</pre>";
    return;
  }
  let ctx = {};
  try { ctx = JSON.parse(data.retrieved_context); } catch (_) {}
  const ans = ctx.answerability || "UNKNOWN";
  const clar = ctx.clarification || null;

  let html =
    '<div><span class="badge b-' + esc(ans) + '">' + esc(ans) + "</span>" +
    '<strong>' + esc(question) + "</strong></div>" +
    '<div class="meta">기준일 ' + esc(ctx.data_snapshot_date || "-") +
    " · 결과 " + esc(ctx.result_count ?? "-") + "건 · HTTP " + status + "</div>" +
    '<div class="answer">' + esc(data.answer || "") + "</div>";

  if (clar && Array.isArray(clar.options) && clar.options.length) {
    pending = { token: clar.clarification_token, question: question };
    html += '<div class="clarify-opts">' + clar.options.map(o =>
      '<button type="button" data-v="' + esc(o.value) + '">' +
      esc(o.label || o.value) + "</button>").join("") + "</div>";
  }

  const ev = ctx.evidence || ctx.sources || null;
  if (Array.isArray(ev) && ev.length) {
    html += "<details><summary>근거 " + ev.length + "건</summary><table>" +
      "<tr><th>파일</th><th>시트</th><th>행</th><th>필드</th></tr>" +
      ev.slice(0, 20).map(e =>
        "<tr><td>" + esc(e.source_file || e.file || "-") + "</td><td>" +
        esc(e.sheet || "-") + "</td><td>" + esc(e.excel_row ?? e.row ?? "-") +
        "</td><td>" + esc(e.source_field || e.field || "-") + "</td></tr>"
      ).join("") + "</table></details>";
  }

  html +=
    "<details><summary>think_trace</summary><pre>" + esc(data.think_trace || "") +
    "</pre></details>" +
    "<details><summary>retrieved_context 원문</summary><pre>" +
    esc(JSON.stringify(ctx, null, 1)) + "</pre></details>";

  card.innerHTML = html;
  card.querySelectorAll(".clarify-opts button").forEach(b => {
    b.onclick = () => ask(question, b.dataset.v);
  });
}
</script>
</body>
</html>
