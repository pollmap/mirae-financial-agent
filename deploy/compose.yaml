name: mirae-financial-agent

services:
  agent:
    image: ${MIRAE_IMAGE:?set MIRAE_IMAGE to an immutable registry/name@sha256 digest}
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --limit-concurrency
      - "64"
    environment:
      APP_ENV: production
      PLANNER_MODE: hcx
      PLANNER_STAGE: ${PLANNER_STAGE:-two}
      VECTOR_ENABLED: ${VECTOR_ENABLED:-false}
      MIRAE_DATABASE_PATH: /app/data/serving/mirae_agent.duckdb
      CLOVA_STUDIO_API_KEY: ${CLOVA_STUDIO_API_KEY:?inject with a secret manager or protected env file}
      HCX_MODEL_ID: ${HCX_MODEL_ID:-HCX-007}
      HCX_BASE_URL: ${HCX_BASE_URL:-https://clovastudio.stream.ntruss.com}
      HCX_TIMEOUT_SECONDS: ${HCX_TIMEOUT_SECONDS:-12}
      HCX_TOTAL_DEADLINE_SECONDS: ${HCX_TOTAL_DEADLINE_SECONDS:-25}
      HCX_MAX_RETRIES: ${HCX_MAX_RETRIES:-2}
      HCX_MAX_CONCURRENCY: ${HCX_MAX_CONCURRENCY:-3}
      HCX_QPM_LIMIT: ${HCX_QPM_LIMIT:-30}
      HCX_TPM_BUDGET: ${HCX_TPM_BUDGET:-60000}
      DB_MAX_CONCURRENCY: ${DB_MAX_CONCURRENCY:-8}
      CLARIFICATION_SIGNING_KEY: ${CLARIFICATION_SIGNING_KEY:?inject at least 24 random bytes}
      ENABLE_CLARIFICATION_STATE: "true"
      QUESTION_MAX_CHARS: ${QUESTION_MAX_CHARS:-2000}
      DEFAULT_RESULT_LIMIT: ${DEFAULT_RESULT_LIMIT:-10}
      MAX_RESULT_LIMIT: ${MAX_RESULT_LIMIT:-50}
      WEB_CONCURRENCY: "1"
      ACCESS_LOG_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 3g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
